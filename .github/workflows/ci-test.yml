name: Test desktop starter
on:
  push:
    branches: [main, 'feat/**']
    paths: ['tc33-builder-pro/**', '.github/workflows/**']
  pull_request:
    paths: ['tc33-builder-pro/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: desktop-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tc33-builder-pro
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tc33-builder-pro/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            tc33-builder-pro/playwright-report
            tc33-builder-pro/test-results
